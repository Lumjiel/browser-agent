name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r server/requirements.txt

    - name: Lint with flake8
      run: |
        cd server && python -m flake8 shizuku_bridge.py --max-line-length=120

    - name: Run tests
      run: |
        cd tests && python -m pytest -v --cov=server --cov-report=xml

    - name: Upload coverage
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  userscript-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check userscript syntax
      run: |
        # 检查油猴脚本头部元数据完整性
        for f in userscript/*.user.js; do
          echo "Checking $f..."
          grep -q "// @name" "$f" || (echo "Missing @name in $f" && exit 1)
          grep -q "// @version" "$f" || (echo "Missing @version in $f" && exit 1)
          grep -q "// @match" "$f" || (echo "Missing @match in $f" && exit 1)
          echo "  ✓ OK"
        done
